name: Refresh funding data

on:
  schedule:
    # 02:00 UTC daily. GitHub cron is best-effort and can run late under load,
    # which is fine here since each run tops up a 7-day window.
    - cron: "0 2 * * *"
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

# Needed to push the refreshed parquet back to the repo.
permissions:
  contents: write

concurrency:
  # Never let two refreshes race each other into a merge conflict.
  group: backfill
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Top up crypto majors
        # Only 7 days, not 365. store.write() merges into the existing parquet
        # and drops duplicates, so a short window keeps us current while
        # staying well inside rate limits.
        run: |
          python3 -m src.backfill \
            --venues binance bybit hyperliquid \
            --symbols BTC ETH SOL DOGE XRP BNB AVAX LINK SUI APT \
            --days 7

      - name: Top up Bybit equity perps
        # US names plus the two Korean semis. Deliberately NOT including
        # CSOPSAMSUNG2LUSDT / CSOPSKHYNIX2LUSDT - those track 2x leveraged CSOP
        # ETFs, a different underlying with its own decay, and their funding is
        # not comparable to the plain listing.
        run: |
          python3 -m src.backfill --venues bybit --quotes USDT \
            --symbols TSLA NVDA AAPL AMZN GOOGL META MSTR COIN SPY QQQ \
                      SKHYNIX SAMSUNG \
            --days 7

      - name: Top up Hyperliquid HIP-3 equities
        # xyz is the only HIP-3 dex with live funding as of 2026-08-21 - flx,
        # km, cash, mkts and vntl all returned exactly 0.0 across 500
        # consecutive hourly observations.
        #
        # SKHX and SKHY both appear in the xyz universe and it's not yet clear
        # which is the live SK Hynix listing. Both are pulled; a dead one logs a
        # failure and the run continues. Drop the loser once the coverage
        # report shows which is which.
        run: |
          python3 -m src.backfill --venues hyperliquid \
            --symbols xyz:TSLA xyz:NVDA xyz:AAPL xyz:AMZN xyz:COIN \
                      xyz:SKHX \
            --days 7

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/funding
          if git diff --staged --quiet; then
            echo "No new data."
          else
            git commit -m "chore: refresh funding data ($(date -u +%Y-%m-%d))"
            git push
          fi
